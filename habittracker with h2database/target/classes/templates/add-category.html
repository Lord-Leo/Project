<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Category - Habit Tracker</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/style.css">

</head>

<body>

<!-- Navigation Bar -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            Habit Tracker
        </a>

        <div>

            <a href="/"
               class="btn btn-outline-light me-2">
                Dashboard
            </a>

            <a href="/habits"
               class="btn btn-outline-light me-2">
                Habits
            </a>

            <a href="/categories"
               class="btn btn-outline-light">
                Categories
            </a>

            <a href="/logout"
               class="btn btn-danger logout-button">
                Logout
            </a>

        </div>

    </div>

</nav>


<!-- Main Content -->

<div class="container main-container">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h2 class="mb-4">
                        Add New Category
                    </h2>

                    <p class="text-muted">
                        Create a category to organize your habits.
                    </p>


                    <!-- Add Category Form -->

                    <form th:action="@{/category/save}"
                          th:object="${category}"
                          method="post">


                        <!-- Category Name -->

                        <div class="mb-4">

                            <label for="name"
                                   class="form-label">

                                Category Name

                            </label>

                            <input type="text"
                                   id="name"
                                   th:field="*{name}"
                                   class="form-control"
                                   placeholder="e.g. Study"
                                   required>

                        </div>


                        <!-- Buttons -->

                        <button type="submit"
                                class="btn btn-primary">

                            Save Category

                        </button>

                        <a href="/categories"
                           class="btn btn-secondary ms-2">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- Footer -->

<div class="footer">

    <p>
        Habit Tracker &copy; 2026
    </p>

</div>

</body>

</html>
