<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Habit Tracker</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
    <div class="card-body">
        <h2 class="text-center mb-4 fw-bold">Create Account</h2>
        <p class="text-center text-muted mb-4">Join Habit Tracker to build better routines.</p>

        <!-- Error Message Display -->
        <div th:if="${error}" class="alert alert-danger" role="text" th:text="${error}"></div>

        <!-- Registration Form mapping to User model attributes -->
        <form th:action="@{/register}" th:object="${user}" method="post">
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="Enter your name" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="Enter your email" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Create a password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Register</button>
        </form>

        <div class="text-center mt-3">
            <p class="text-muted">Already have an account? <a href="/login" class="text-decoration-none">Login here</a></p>
        </div>
    </div>
</div>

</body>
</html>
