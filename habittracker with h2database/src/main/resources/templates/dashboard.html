<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Habit Tracker</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/style.css">

</head>

<body>

<!-- ========================= -->
<!-- Navigation Bar -->
<!-- ========================= -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <!-- Website Name -->

        <a class="navbar-brand" href="/">
            Habit Tracker
        </a>


        <!-- Navigation Links -->

        <div class="dashboard-nav">

            <a href="/"
               class="btn btn-outline-light me-2">
                Dashboard
            </a>

            <a href="/habits"
               class="btn btn-outline-light me-2">
                Habits
            </a>

            <a href="/categories"
               class="btn btn-outline-light me-2">
                Categories
            </a>


            <!-- Logged-in User -->
            <span class="welcome-text"
                  th:text="'Welcome, ' + ${session.loggedInUser.name}">
                Welcome, User
            </span>


            <!-- Logout -->

            <a href="/logout"
               class="btn btn-danger logout-button">
                Logout
            </a>

        </div>

    </div>

</nav>


<!-- ========================= -->
<!-- Main Content -->
<!-- ========================= -->

<div class="container main-container">


    <!-- Page Heading -->

    <div class="text-center">

        <h1 class="dashboard-title">
            Habit Tracker Dashboard
        </h1>

        <p class="dashboard-subtitle">
            Track your habits and build better daily routines.
        </p>

    </div>


    <!-- ========================= -->
    <!-- Statistics Cards -->
    <!-- ========================= -->

    <div class="row g-4">


        <!-- Total Habits -->

        <div class="col-md-3">

            <div class="card stat-card shadow-sm">

                <div class="card-body text-center">

                    <h5>
                        Total Habits
                    </h5>

                    <div class="stat-number"
                         th:text="${totalHabits}">

                        0

                    </div>

                </div>

            </div>

        </div>


        <!-- Completed Habits -->

        <div class="col-md-3">

            <div class="card stat-card shadow-sm">

                <div class="card-body text-center">

                    <h5>
                        Completed
                    </h5>

                    <div class="stat-number"
                         th:text="${completedHabits}">

                        0

                    </div>

                </div>

            </div>

        </div>


        <!-- Pending Habits -->

        <div class="col-md-3">

            <div class="card stat-card shadow-sm">

                <div class="card-body text-center">

                    <h5>
                        Pending
                    </h5>

                    <div class="stat-number"
                         th:text="${pendingHabits}">

                        0

                    </div>

                </div>

            </div>

        </div>


        <!-- Categories -->

        <div class="col-md-3">

            <div class="card stat-card shadow-sm">

                <div class="card-body text-center">

                    <h5>
                        Categories
                    </h5>

                    <div class="stat-number"
                         th:text="${totalCategories}">

                        0

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- Quick Actions -->
    <!-- ========================= -->

    <div class="card custom-card shadow-sm mt-5">

        <div class="card-body text-center p-5">

            <h3>
                Quick Actions
            </h3>

            <p class="text-muted">
                Manage your habits and categories.
            </p>

            <div class="mt-3">

                <a href="/habit/new"
                   class="btn btn-primary me-2">

                    + Add Habit

                </a>

                <a href="/category/new"
                   class="btn btn-secondary">

                    + Add Category

                </a>

            </div>

        </div>

    </div>

</div>


<!-- ========================= -->
<!-- Footer -->
<!-- ========================= -->

<div class="footer">

    <p>
        Habit Tracker &copy; 2026
    </p>

</div>


</body>

</html>
