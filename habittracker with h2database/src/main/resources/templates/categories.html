<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Categories - Habit Tracker</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/style.css">

</head>

<body>

<!-- Navigation Bar -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            Habit Tracker
        </a>

        <div>

            <a href="/"
               class="btn btn-outline-light me-2">
                Dashboard
            </a>

            <a href="/habits"
               class="btn btn-outline-light me-2">
                Habits
            </a>

            <a href="/categories"
               class="btn btn-outline-light">
                Categories
            </a>

            <a href="/logout"
               class="btn btn-danger logout-button">
                Logout
            </a>

        </div>

    </div>

</nav>


<!-- Main Content -->

<div class="container main-container">

    <!-- Heading -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1>
                Categories
            </h1>

            <p class="text-muted">
                Organize your habits into categories.
            </p>

        </div>

        <a href="/category/new"
           class="btn btn-primary">

            + Add Category

        </a>

    </div>


    <!-- Categories Table -->

    <div class="card shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                    <tr>

                        <th>ID</th>

                        <th>Category Name</th>

                        <th>Number of Habits</th>

                        <th>Actions</th>

                    </tr>

                    </thead>


                    <tbody>

                    <!-- Display categories -->

                    <tr th:each="category : ${categories}">

                        <!-- ID -->

                        <td th:text="${category.id}">
                            1
                        </td>


                        <!-- Category Name -->

                        <td>

                            <strong th:text="${category.name}">
                                Study
                            </strong>

                        </td>


                        <!-- Number of Habits -->

                        <td th:text="${#lists.size(category.habits)}">
                            0
                        </td>


                        <!-- Actions -->

                        <td>

                            <a th:href="@{/category/delete/{id}(id=${category.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Are you sure you want to delete this category?');">

                                Delete

                            </a>

                        </td>

                    </tr>


                    <!-- Empty list -->

                    <tr th:if="${#lists.isEmpty(categories)}">

                        <td colspan="4"
                            class="text-center py-4">

                            <p class="text-muted mb-2">
                                No categories found.
                            </p>

                            <a href="/category/new"
                               class="btn btn-primary">

                                Create Your First Category

                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<!-- Footer -->

<div class="footer">

    <p>
        Habit Tracker &copy; 2026
    </p>

</div>

</body>

</html>
