<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Habit - Habit Tracker</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/style.css">

</head>

<body>

<!-- Navigation Bar -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            Habit Tracker
        </a>

        <div>

            <a href="/"
               class="btn btn-outline-light me-2">
                Dashboard
            </a>

            <a href="/habits"
               class="btn btn-outline-light me-2">
                Habits
            </a>

            <a href="/categories"
               class="btn btn-outline-light">
                Categories
            </a>

            <a href="/logout"
               class="btn btn-danger logout-button">
                Logout
            </a>

        </div>

    </div>

</nav>


<!-- Main Content -->

<div class="container main-container">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h2 class="mb-4">
                        Edit Habit
                    </h2>

                    <p class="text-muted">
                        Update the information for this habit.
                    </p>


                    <!-- Edit Habit Form -->

                    <form th:action="@{/habit/update}"
                          th:object="${habit}"
                          method="post">

                        <!-- Hidden ID -->

                        <input type="hidden"
                               th:field="*{id}">


                        <!-- Habit Title -->

                        <div class="mb-3">

                            <label for="title"
                                   class="form-label">

                                Habit Title

                            </label>

                            <input type="text"
                                   id="title"
                                   th:field="*{title}"
                                   class="form-control"
                                   placeholder="Enter habit title"
                                   required>

                        </div>


                        <!-- Description -->

                        <div class="mb-3">

                            <label for="description"
                                   class="form-label">

                                Description

                            </label>

                            <textarea id="description"
                                      th:field="*{description}"
                                      class="form-control"
                                      rows="4"
                                      placeholder="Enter habit description"
                                      required></textarea>

                        </div>


                        <!-- Category -->

                        <div class="mb-3">

                            <label for="category"
                                   class="form-label">

                                Category

                            </label>

                            <select id="category"
                                    name="category.id"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Select a category
                                </option>

                                <option th:each="category : ${categories}"
                                        th:value="${category.id}"
                                        th:text="${category.name}"
                                        th:selected="${habit.category != null and habit.category.id == category.id}">
                                </option>

                            </select>

                        </div>


                        <!-- Completed Status -->

                        <div class="form-check mb-4">

                            <input type="checkbox"
                                   id="completed"
                                   th:field="*{completed}"
                                   class="form-check-input">

                            <label for="completed"
                                   class="form-check-label">

                                Mark as completed

                            </label>

                        </div>


                        <!-- Buttons -->

                        <button type="submit"
                                class="btn btn-primary">

                            Update Habit

                        </button>

                        <a href="/habits"
                           class="btn btn-secondary ms-2">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- Footer -->

<div class="footer">

    <p>
        Habit Tracker &copy; 2026
    </p>

</div>

</body>

</html>
